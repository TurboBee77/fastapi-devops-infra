---
# ----------------- CD key ------------------
- name: Powiąż VM2 z Jenkinsem (klucz CD, IP appki) - tylko pełny przebieg
  ansible.builtin.include_tasks: provisioning_ci_link.yml
  when: full_provisioning_run | bool

- name: Stwórz katalog docelowy dla appki
  ansible.builtin.file:
    path: "{{ app_dest }}"
    state: directory
    mode: "0755"

- name: Wyrenderuj docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dest }}/docker-compose.yml"
    mode: "0600"

- name: Pobierz obraz i uruchom stack (app + db)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dest }}"
    pull: "{{ 'always' if app_image_tag == 'latest' else 'missing' }}"
    state: present
 