---
# ----------------- CD key ------------------
- name: Dodaj klucz SSH do autoryzacji na VM2
  ansible.posix.authorized_key:
    user: ubuntu
    state: present
    key: "{{ lookup('file', jenkins_cd_public_key_path) }}"

- name: Stwórz katalog docelowy dla appki
  ansible.builtin.file:
    path: "{{ app_dest }}"
    state: directory
    mode: "0755"

- name: Wyrenderuj docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dest }}/docker-compose.yml"
    mode: "0600"

- name: Pobierz obraz i uruchom stack (app + db)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dest }}"
    pull: always
    state: present
