---
# ----------------- CD key ------------------
- name: Dodaj klucz SSH do autoryzacji na VM2
  ansible.posix.authorized_key:
    user: ubuntu
    state: present
    key: "{{ lookup('file', jenkins_cd_public_key_path) }}"
  when: full_provisioning_run | bool


- name: Upewnij się, że katalog sekretów na VM1 istnieje
  ansible.builtin.file:
    path: "{{ hostvars[groups['ci'][0]]['jenkins_home'] }}/secrets"
    state: directory
    mode: "0700"
  delegate_to: "{{ groups['ci'][0] }}"
  when: full_provisioning_run | bool

- name: Udostępnij aktualne IP VM2 dla stage Deploy w Jenkinsie
  ansible.builtin.copy:
    content: "{{ ansible_host }}"
    dest: "{{ hostvars[groups['ci'][0]]['jenkins_home'] }}/secrets/app_host_ip"
    mode: "0644"
  delegate_to: "{{ groups['ci'][0] }}"
  when: full_provisioning_run | bool

- name: Stwórz katalog docelowy dla appki
  ansible.builtin.file:
    path: "{{ app_dest }}"
    state: directory
    mode: "0755"

- name: Wyrenderuj docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dest }}/docker-compose.yml"
    mode: "0600"

- name: Pobierz obraz i uruchom stack (app + db)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dest }}"
    pull: "{{ 'always' if app_image_tag == 'latest' else 'missing' }}"
    state: present
 