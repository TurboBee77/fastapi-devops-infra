---
- name: Zainstaluj zależności potrzebne do dodania repozytorium Dockera
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Utwórz katalog na klucze APT (keyrings)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Pobierz klucz publiczny GPG dockera
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dodaj repozytorium APT Dockera
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Zainstaluj Docker Engine i wtyczki (compose, buildx)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Uruchom i włącz usługę docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Dodaj użytkownika ubuntu do grupy docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

